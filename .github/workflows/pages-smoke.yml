name: Pages smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pages-smoke:
    name: Verify public demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch repository
        uses: actions/checkout@v4
      - name: Verify Pages files
        run: node scripts/verify-pages.mjs
